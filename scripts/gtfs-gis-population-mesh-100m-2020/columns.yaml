# 令和2年 簡易100mメッシュ人口（GTFS-GIS.jp）の列の定義
#
# この1ファイルから、変換の SQL（build.py）、collection.json の table:columns、
# README の列の表を作る（docs/metadata.md 第5章「同じ元から作る」）。
#
#   name : 列名（英語の snake_case。日英で同じ）
#   src  : 元の CSV の列名
#   sql  : 値の式。省略すると "<src>" そのまま
#   ja   : 説明（日本語）。「元の列名: …」は自動で先頭に付く
#   en   : 説明（英語）

columns:
  - name: mesh_code
    src: Meshcode
    ja: 100mメッシュのコード（10桁の文字列）。3次メッシュ（約1km）のコード8桁に、3次メッシュを縦横10等分した区画の番号（緯度方向1桁、経度方向1桁）を足したもの。1行に1つで、重複しない。
    en: 100 m mesh code (10-digit string) - the 8-digit tertiary mesh (about 1 km) code followed by one digit each for the row (latitude) and column (longitude) of the cell when the tertiary mesh is divided into 10 by 10. Unique per row.

  - name: pop_total
    src: PopT
    ja: 総人口（推計。小数を含む）。国勢調査の250mメッシュの人口を、建物の面積で100mメッシュに按分した値。年齢3区分の和より大きいことがある（全国で約293万人多い。年齢不詳を含むためと考えられる）。
    en: Total population (estimated; fractional). The population of the census 250 m mesh, apportioned to 100 m cells by building floor area. Can be larger than the sum of the three age groups (by about 2.93 million nationwide), probably because it includes persons of unknown age.

  - name: pop_0_14
    src: Pop0_14
    ja: 0〜14歳の人口（推計。小数を含む）。
    en: Population aged 0-14 (estimated; fractional).

  - name: pop_15_64
    src: Pop15_64
    ja: 15〜64歳の人口（推計。小数を含む）。
    en: Population aged 15-64 (estimated; fractional).

  - name: pop_65_over
    src: Pop65over
    ja: 65歳以上の人口（推計。小数を含む）。
    en: Population aged 65 and over (estimated; fractional).

  - name: pop_75_over
    src: Pop75over
    ja: 75歳以上の人口（推計。小数を含む）。pop_65_over の内数。
    en: Population aged 75 and over (estimated; fractional). Included in pop_65_over.

  - name: pop_85_over
    src: Pop85over
    ja: 85歳以上の人口（推計。小数を含む）。pop_75_over の内数。
    en: Population aged 85 and over (estimated; fractional). Included in pop_75_over.

geometry:
  ja: 100mメッシュの範囲（ポリゴン、EPSG:4326）。緯度3秒×経度4.5秒の長方形。mesh_code から計算した（元の shape ファイルの形と同じ）。
  en: The 100 m mesh cell as a polygon in EPSG:4326 - a rectangle of 3 seconds of latitude by 4.5 seconds of longitude, computed from mesh_code (identical to the shapes in the source shapefiles).
