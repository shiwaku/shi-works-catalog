# 英語版の文言（docs/metadata.md 第2章）
#
# 日本語の木（catalog/）の STAC ファイルごとに、英語に置き換える項目を書く。
# キーは catalog/ からのパス。列の説明は scripts/<コレクション>/columns.yaml の en にある。
# 訳語はルートの AGENTS.md の用語集に従う。

catalog.json:
  title: "shi-works catalog"
  description: "Catalog of geospatial data served by shi-works.com"

jp-npa/catalog.json:
  title: "National Police Agency"
  description: "Data published by the National Police Agency (NPA) of Japan."

jp-npa/traffic-accident/collection.json:
  title: "Traffic accident statistics (main records)"
  description: "Main records (one record per injury accident) of the National Police Agency's open traffic accident statistics, 2019-2025, 2,182,298 accidents. Each record has the accident location as a point and 74 attributes on time, road and parties involved."
  keywords:
    - "transport"
    - "traffic accident"
    - "injury accident"
    - "Japan"
    - "nationwide"
    - "National Police Agency"
    - "NPA"
  attribution: "\"Open data of traffic accident statistics\" (National Police Agency), modified"
  providers:
    "警察庁": "National Police Agency"

jp-ksj/catalog.json:
  title: "National Land Numerical Information"
  description: "National Land Numerical Information (KSJ) maintained and published by the Ministry of Land, Infrastructure, Transport and Tourism: basic geospatial data on Japan such as administrative boundaries and schools."

jp-ksj/admin-boundaries/collection.json:
  title: "Administrative boundaries"
  description: "Administrative boundary data (N03) of the National Land Numerical Information, as of 1 January 2026. Boundaries of all 1,905 municipalities in Japan (wards for designated cities), one multipolygon row per municipality."
  keywords:
    - "boundaries"
    - "administrative boundaries"
    - "municipalities"
    - "Japan"
    - "nationwide"
    - "National Land Numerical Information"
    - "KSJ"
    - "Ministry of Land, Infrastructure, Transport and Tourism"
    - "MLIT"
  attribution: "\"National Land Numerical Information (administrative boundaries)\" (Ministry of Land, Infrastructure, Transport and Tourism), modified"
  providers:
    "国土交通省": "Ministry of Land, Infrastructure, Transport and Tourism"

gtfs-gis/catalog.json:
  title: "GTFS-GIS.jp"
  description: "Data created and processed by Akira Nishizawa (Center for Spatial Information Science, the University of Tokyo) and published on the regional data page of GTFS-GIS.jp, such as the simplified 100 m mesh population and railway service frequency."

gtfs-gis/population-mesh-100m-2020/collection.json:
  title: "Simplified 100 m mesh population (2020)"
  description: "Estimated population of 100 m mesh cells, apportioning the 250 m mesh population of the 2020 Census by building floor area (Akira Nishizawa, GTFS-GIS.jp). Total population and population by age group for 4,979,919 cells across Japan, one polygon row per cell."
  keywords:
    - "population"
    - "population mesh"
    - "100 m mesh"
    - "census"
    - "Japan"
    - "nationwide"
    - "GTFS-GIS.jp"
  attribution: "\"Simplified 100 m mesh population (2020)\" (Akira Nishizawa, GTFS-GIS.jp, CC BY 4.0), modified"
  providers:
    "西澤明（GTFS-GIS.jp）": "Akira Nishizawa (GTFS-GIS.jp)"
