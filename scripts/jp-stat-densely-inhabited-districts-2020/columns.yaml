# 人口集中地区（令和2年国勢調査、e-Stat の境界データ）の列の定義
#
# この1ファイルから、変換の SQL（build.py）、collection.json の table:columns、
# README の列の表を作る（docs/metadata.md 第5章「同じ元から作る」）。
#
#   name : 列名（英語の snake_case。日英で同じ）
#   src  : 元の属性名（KEN など）。足した列は null
#   sql  : 値の式。省略すると "<src>" そのまま
#   ja   : 説明（日本語）。「元の列名: …」は自動で先頭に付く
#   en   : 説明（英語）

columns:
  - name: admin_code
    src: null
    sql: KEN || CITY
    ja: 全国地方公共団体コード（5桁の文字列。チェックディジットなし）。元の KEN（都道府県コード）と CITY（市区町村コード）をつないだもの。2020年10月1日時点のコードで、政令指定都市は区ごと。
    en: Local government code (5-digit string, without the check digit), joining the source KEN (prefecture code) and CITY (municipality code). Codes as of 1 October 2020; designated cities are split into wards.

  - name: pref_code
    src: KEN
    ja: 都道府県コード（2桁の文字列。01 北海道 〜 47 沖縄県）。
    en: Prefecture code (2-digit string, 01 Hokkaido to 47 Okinawa).

  - name: municipality_name
    src: CITYNAME
    ja: 市区町村名（2020年10月1日時点）。政令指定都市の区は「札幌市北区」のように市の名前から書く。
    en: Municipality name as of 1 October 2020 (in Japanese). Wards of designated cities include the city name, e.g. "札幌市北区".

  - name: did_number
    src: CLASS
    ja: 市区町村の中での人口集中地区の番号（1から）。人口の多い順で、1が最大。admin_code と did_number の組で1行が決まる。
    en: Number of the densely inhabited district within the municipality (from 1), in descending order of population; 1 is the largest. admin_code and did_number together identify a row.

  - name: population
    src: JINKO
    ja: 人口集中地区の人口（人。令和2年国勢調査）。
    en: Population of the densely inhabited district (persons, 2020 Census).

  - name: area_km2
    src: MENSEKI
    ja: 人口集中地区の面積（km²。小数第2位まで）。元データの値で、geometry から計算したものではない。
    en: Area of the densely inhabited district (km², two decimal places). The source value, not computed from the geometry.

geometry:
  ja: 人口集中地区の範囲（マルチポリゴン、EPSG:4326）。元データの5行にあった自己接触などの不正な形は ST_MakeValid で直した（面積は変わらない）。
  en: Boundary of the densely inhabited district as a multipolygon in EPSG:4326. Invalid shapes (such as self-touching rings) in five source rows were repaired with ST_MakeValid; the areas are unchanged.
