    '1': 右折専用車線あり
    '2': 右折専用車線なし
    '3': 右折禁止
    '4': 調査路線が右折
  ja: '代表信号交差点の右折専用車線の有無など。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 右折専用車線あり、2 右折専用車線なし、3 右折禁止、4 調査路線が右折（数字は元のコード）。'
  en: 'Right-turn lane at the representative signalized intersection. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 右折専用車線あり yes, なし no, 右折禁止 right turn prohibited, 調査路線が右折 the surveyed route turns right.'
- name: has_railway_crossing
  src: 鉄道との平面交差箇所の有無
  bool:
    '1': true
    '2': false
  ja: 鉄道との平面交差（踏切）があれば true。元のコードは 1（あり）と 2（なし）。
  en: True if there is a level crossing with a railway. Source codes 1 (yes) and 2 (no).
- name: speed_limit_kmh
  src: 指定最高速度（ｋｍ／ｈ）
  type: SMALLINT
  ja: 最高速度（km/h）。標識などで指定された速度。指定がない道路は道路交通法施行令の法定速度。
  en: 'Speed limit (km/h): the posted limit, or the statutory limit where none is posted.'
- name: has_climbing_lane_up
  src: 付加車線及び登坂車線設置箇所の有無／上り
  bool:
    '1': true
    '2': false
  ja: 上りに付加車線・登坂車線があれば true。元のコードは 1（あり）と 2（なし）。
  en: True if there is an additional or climbing lane in the up direction. Source codes 1 (yes) and 2 (no).
- name: has_climbing_lane_down
  src: 付加車線及び登坂車線設置箇所の有無／下り
  bool:
    '1': true
    '2': false
  ja: 下りに付加車線・登坂車線があれば true。元のコードは 1（あり）と 2（なし）。
  en: True if there is an additional or climbing lane in the down direction. Source codes 1 (yes) and 2 (no).
- name: roadside_status
  src: 代表沿道状況
  codes:
    '1': 人口集中地区かつ商業地域
    '2': 人口集中地区（商業地域を除く）
    '3': その他市街部
    '4': 平地部
    '5': 山地部
  ja: '代表沿道状況（調査単位区間で最も長い沿道の状況）。人口集中地区は平成27年国勢調査のもの。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 人口集中地区かつ商業地域、2 人口集中地区（商業地域を除く）、3 その他市街部、4 平地部、5 山地部（数字は元のコード）。'
  en: 'Representative roadside condition (the longest in the unit section). Densely inhabited districts are those of the 2015 Census. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 人口集中地区かつ商業地域 DID and commercial zone, 人口集中地区 DID, その他市街部 other built-up area, 平地部 flat rural, 山地部 mountainous.'
- name: median_type
  src: 中央分離帯／中央分離帯の種類
  codes:
    '1': 物理的分離（高架道路等の橋脚、地形要因による分離）
    '2': 剛性防護柵
    '3': たわみ性防護柵
    '4': その他の柵
    '5': 植樹施設、マウントアップ
    '6': 簡易な分離（ラバーポール、チャッターバー等）
    '7': 構造物なし（マーキング）
    '8': 中央分離帯なし
  ja: '中央分離帯の種類。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 物理的分離（高架道路等の橋脚、地形要因による分離）、2 剛性防護柵、3 たわみ性防護柵、4 その他の柵、5 植樹施設、マウントアップ、6 簡易な分離（ラバーポール、チャッターバー等）、7 構造物なし（マーキング）、8 中央分離帯なし（数字は元のコード）。'
  en: 'Type of median. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): from physical separation and guard fences to rubber poles, markings only, and no median.'
- name: median_installation
  src: 中央分離帯／中央分離帯の設置状況
  codes:
    '1': 区間全体に設置
    '2': 一部区間に設置（区間の概ね3分の2以上）
    '3': あまり設置されていない
  ja: '中央分離帯の設置状況（種類が物理的分離のときだけ）。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 区間全体に設置、2 一部区間に設置（区間の概ね3分の2以上）、3 あまり設置されていない（数字は元のコード）。'
  en: 'How much of the section has the median (only for physical medians). Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 区間全体 whole section, 一部区間 most of it, あまり設置されていない little.'
- name: tramway
  src: 軌道の有無
  codes:
    '1': 軌道あり（軌道敷内通行可）
    '2': 軌道あり（軌道敷内一部通行可）
    '3': 軌道あり（軌道敷内通行不可）
    '4': 軌道なし
  ja: '車道部の軌道（路面電車）の有無。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 軌道あり（軌道敷内通行可）、2 軌道あり（軌道敷内一部通行可）、3 軌道あり（軌道敷内通行不可）、4 軌道なし（数字は元のコード）。'
  en: 'Tramway on the roadway. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 軌道あり with tram tracks (driving on the tracks allowed, partly allowed or not allowed), 軌道なし none.'
- name: bicycle_on_sidewalk
  src: 自転車通行可能区分
  codes:
    '1': 全区間通行可
    '2': 一部通行可又は通行可能な歩道なし
  ja: '自転車が通行できる歩道・自転車道があるか。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 全区間通行可、2 一部通行可又は通行可能な歩道なし（数字は元のコード）。'
  en: 'Whether bicycles may use the sidewalks or bicycle tracks. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 全区間通行可 whole section, 一部通行可又は通行可能な歩道なし partly or none.'
- name: weather_regulation
  src: 異常気象時等通行規制区分
  codes:
    '1': 異常気象時等通行規制なし（冬期通行規制なし）
    '2': 雨量規制あり（冬期通行規制なし）
    '3': 雪規制あり（冬期通行規制なし）
    '4': その他規制あり（冬期通行規制なし）
    '5': 異常気象時等通行規制なし（冬期通行不可）
    '6': 雨量規制あり（冬期通行不可）
    '7': 雪規制あり（冬期通行不可）
    '8': その他規制あり（冬期通行不可）
  ja: '異常気象時の通行規制と冬期の通行止め。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 異常気象時等通行規制なし（冬期通行規制なし）、2 雨量規制あり（冬期通行規制なし）、3 雪規制あり（冬期通行規制なし）、4 その他規制あり（冬期通行規制なし）、5 異常気象時等通行規制なし（冬期通行不可）、6 雨量規制あり（冬期通行不可）、7 雪規制あり（冬期通行不可）、8 その他規制あり（冬期通行不可）（数字は元のコード）。'
  en: 'Traffic restrictions in severe weather and winter closures. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): rainfall, snow or other restrictions, with or without winter closure.'
- name: has_reversible_lane
  src: リバーシブルレーン運用の有無
  bool:
    '1': true
    '2': false
  ja: リバーシブルレーン（可逆車線）を運用していれば true。元のコードは 1（あり）と 2（なし）。
  en: True if a reversible lane is operated. Source codes 1 (yes) and 2 (no).
- name: access_control
  src: アクセスコントロール
  codes:
    '1': 完全出入制限
    '2': 部分出入制限
    '3': 地形要因等により出入路なし
    '4': 出入自由
  ja: '出入制限。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 完全出入制限、2 部分出入制限、3 地形要因等により出入路なし、4 出入自由（数字は元のコード）。'
  en: 'Access control. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 完全出入制限 full, 部分出入制限 partial, 地形要因等により出入路なし no access due to terrain, 出入自由 none.'
- name: h27_road_unit_area_code
  src: 平成２７年度／道路状況／都道府県指定市コード
  pad: 5
  ja: 対応する平成27年度の道路状況調査単位区間の都道府県指定市コード（5桁の文字列）。調査単位区間番号の番号を振る単位（都道府県、指定市など）のコード。元データで先頭の0が落ちているので補った。
  en: 'Area code of the corresponding 2015 road condition survey unit section (5-character string): code of the area (prefecture, designated city, etc.) within which the survey unit sections are numbered. Leading zeros restored.'
- name: h27_road_unit_section_number
  src: 平成２７年度／道路状況／調査単位区間番号
  pad: 5
  ja: 対応する平成27年度の道路状況調査単位区間番号（5桁の文字列）。交通調査基本区間を集約した調査単位区間の番号。都道府県指定市コードと組み合わせて1つの調査単位区間を表す。元データで先頭の0が落ちているので補った。
  en: 'Corresponding 2015 road condition survey unit section number (5-character string): number of the survey unit section that groups basic sections. Identifies a unit section together with the area code. Leading zeros restored.'
geometry:
  ja: 区間の線（マルチライン）。国土交通省の可視化ツール（WEBマップ）の線を区間ごとにつないだもの。可視化ツールに線がない353区間は空（null）。
  en: Section line (multilinestring), joined per section from the lines of the MLIT visualization tool (web map). Null for the 353 sections without a line in the tool.
