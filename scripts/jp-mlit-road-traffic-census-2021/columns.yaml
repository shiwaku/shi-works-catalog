  type: INTEGER
  ja: 上りの24時間自動車類交通量（小型車、台）。
  en: 24-hour motor vehicle traffic in the up direction, small vehicles (vehicles).
- name: up_traffic_24h_large
  src: 上り／２４時間自動車類交通量／大型車（台）
  type: INTEGER
  ja: 上りの24時間自動車類交通量（大型車、台）。
  en: 24-hour motor vehicle traffic in the up direction, large vehicles (vehicles).
- name: up_traffic_24h
  src: 上り／２４時間自動車類交通量／合計（台）
  type: INTEGER
  ja: 上りの24時間自動車類交通量（合計、台）。
  en: 24-hour motor vehicle traffic in the up direction, all vehicles (vehicles).
- name: down_observation_section_id
  src: 下り／観測地点交通調査基本区間番号
  ja: 下りの交通量を観測した地点がある交通調査基本区間の番号（観測した区間のみ）。
  en: Section number of the basic section containing the observation point for the down direction (observed sections only).
- name: down_observation_place
  src: 下り／交通量観測地点地名
  ja: 下りの交通量観測地点の地名、または IC 区間名（観測した区間のみ）。
  en: Place name of the observation point for the down direction, or the interchange section name (observed sections only; in Japanese).
- name: down_traffic_observed
  src: 下り／令和３年度調査交通量観測・非観測の別
  codes: *id002
  ja: '下りの交通量が令和3年度の観測値か推定値か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 観測、2 非観測（推定値）（数字は元のコード）。空は推定できなかった区間（データなし）。推定値は実態と離れていることがあると説明資料にある。'
  en: 'Whether the down direction traffic volume was observed in 2021 or estimated. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 観測 observed, 非観測（推定値） estimated. Null where it could not be estimated. The MLIT document notes that estimates may differ from actual traffic.'
- name: down_individual_survey_used
  src: 下り／個別調査結果活用の別
  bool:
    '1': true
    '0': false
  ja: 下りの交通量に、平成27年度以降の個別調査の観測値を使ったなら true。元のコードは 1（活用あり）と 0（活用なし）。
  en: True if the down direction traffic volume uses values from an individual survey after 2015. Source codes 1 (used) and 0 (not used).
- name: down_observation_hours
  src: 下り／１２時間・２４時間観測の別
  codes: *id003
  ja: '下りの観測が12時間か24時間か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 調査対象区間外（非観測）、1 12時間観測地点、2 24時間観測地点（数字は元のコード）。'
  en: 'Whether the down direction observation was 12-hour or 24-hour. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 12時間観測地点 12-hour, 24時間観測地点 24-hour, 調査対象区間外（非観測） not observed.'
- name: down_observation_date
  src: 下り／交通量観測年月日
  ja: 下りの交通量の観測年月日（YYYYMMDD の8桁の文字列）。常時観測装置などで複数日のデータを使ったときは日が「00」。
  en: Observation date for the down direction (8-character string YYYYMMDD). The day is "00" when data from several days (e.g. permanent counters) were used.
