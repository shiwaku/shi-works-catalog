  type: INTEGER
  ja: 下りの昼間12時間自動車類交通量（合計、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic in the down direction, all vehicles (vehicles).
- name: down_traffic_24h_small
  src: 下り／２４時間自動車類交通量／小型車（台）
  type: INTEGER
  ja: 下りの24時間自動車類交通量（小型車、台）。
  en: 24-hour motor vehicle traffic in the down direction, small vehicles (vehicles).
- name: down_traffic_24h_large
  src: 下り／２４時間自動車類交通量／大型車（台）
  type: INTEGER
  ja: 下りの24時間自動車類交通量（大型車、台）。
  en: 24-hour motor vehicle traffic in the down direction, large vehicles (vehicles).
- name: down_traffic_24h
  src: 下り／２４時間自動車類交通量／合計（台）
  type: INTEGER
  ja: 下りの24時間自動車類交通量（合計、台）。
  en: 24-hour motor vehicle traffic in the down direction, all vehicles (vehicles).
- name: traffic_12h_small
  src: 昼間１２時間自動車類交通量（上下合計）／小型車（台）
  type: INTEGER
  ja: 昼間12時間自動車類交通量（上下合計、小型車、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic, both directions, small vehicles (vehicles).
- name: traffic_12h_large
  src: 昼間１２時間自動車類交通量（上下合計）／大型車（台）
  type: INTEGER
  ja: 昼間12時間自動車類交通量（上下合計、大型車、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic, both directions, large vehicles (vehicles).
- name: traffic_12h
  src: 昼間１２時間自動車類交通量（上下合計）／合計（台）
  type: INTEGER
  ja: 昼間12時間自動車類交通量（上下合計、合計、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic, both directions, all vehicles (vehicles).
- name: traffic_24h_small
  src: ２４時間自動車類交通量（上下合計）／小型車（台）
  type: INTEGER
  ja: 24時間自動車類交通量（上下合計、小型車、台）。12時間観測・推定の区間では、昼夜率などから推定した値。
  en: 24-hour motor vehicle traffic, both directions, small vehicles (vehicles). For 12-hour observations and estimated sections it is estimated from the day-night ratio.
- name: traffic_24h_large
  src: ２４時間自動車類交通量（上下合計）／大型車（台）
  type: INTEGER
  ja: 24時間自動車類交通量（上下合計、大型車、台）。12時間観測・推定の区間では、昼夜率などから推定した値。
  en: 24-hour motor vehicle traffic, both directions, large vehicles (vehicles). For 12-hour observations and estimated sections it is estimated from the day-night ratio.
- name: traffic_24h
  src: ２４時間自動車類交通量（上下合計）／合計（台）
  type: INTEGER
  ja: 24時間自動車類交通量（上下合計、合計、台）。交通量の分析では、ふつうこの列を使う。12時間観測・推定の区間では、昼夜率などから推定した値。
  en: 24-hour motor vehicle traffic, both directions, all vehicles (vehicles). This is the column usually used for traffic volume. For 12-hour observations and estimated sections it is estimated from the day-night ratio.
- name: day_night_ratio
  src: 昼夜率
  type: DOUBLE
  ja: 昼夜率（24時間交通量 ÷ 昼間12時間交通量）。
  en: Day-night ratio (24-hour traffic / daytime 12-hour traffic).
- name: peak_ratio_12h_pct
  src: 昼間１２時間ピーク比率（％）
  type: DOUBLE
  ja: 昼間12時間ピーク比率（%）。最も多い1時間の交通量 ÷ 昼間12時間交通量。
  en: 'Peak-hour ratio (%): traffic in the busiest hour / daytime 12-hour traffic.'
- name: large_vehicle_ratio_12h_pct
  src: 昼間１２時間大型車混入率（％）
  type: DOUBLE
  ja: 昼間12時間大型車混入率（%）。大型車交通量 ÷ 全車交通量。
  en: Share of large vehicles in daytime 12-hour traffic (%).
- name: congestion_degree
  src: 混雑度
  type: DOUBLE
  ja: 混雑度（昼間12時間交通量 ÷ 12時間交通容量）。1.0 を超えると、交通容量より交通量が多い。
  en: Congestion degree (daytime 12-hour traffic / 12-hour traffic capacity). Above 1.0, traffic exceeds capacity.
- name: h27_traffic_unit_area_code
  src: 平成２７年度／交通量／都道府県指定市コード
  pad: 5
  ja: 対応する平成27年度の交通量調査単位区間の都道府県指定市コード（5桁の文字列）。調査単位区間番号の番号を振る単位（都道府県、指定市など）のコード。元データで先頭の0が落ちているので補った。
  en: 'Area code of the corresponding 2015 traffic survey unit section (5-character string): code of the area (prefecture, designated city, etc.) within which the survey unit sections are numbered. Leading zeros restored.'
- name: h27_traffic_unit_section_number
  src: 平成２７年度／交通量／調査単位区間番号
  pad: 5
  ja: 対応する平成27年度の交通量調査単位区間番号（5桁の文字列）。交通調査基本区間を集約した調査単位区間の番号。都道府県指定市コードと組み合わせて1つの調査単位区間を表す。元データで先頭の0が落ちているので補った。
  en: 'Corresponding 2015 traffic survey unit section number (5-character string): number of the survey unit section that groups basic sections. Identifies a unit section together with the area code. Leading zeros restored.'
- name: h27_traffic_12h
  src: 平成２７年度／昼間１２時間自動車類交通量（台）
  type: INTEGER
  ja: 平成27年度の昼間12時間自動車類交通量（上下合計、台）。
  en: Daytime 12-hour motor vehicle traffic in 2015, both directions (vehicles).
- name: h27_traffic_24h
  src: 平成２７年度／２４時間自動車類交通量（台）
  type: INTEGER
  ja: 平成27年度の24時間自動車類交通量（上下合計、台）。
  en: 24-hour motor vehicle traffic in 2015, both directions (vehicles).
- name: speed_unit_area_code
  src: 旅行速度／都道府県指定市コード
  pad: 5
  ja: 旅行速度調査の都道府県指定市コード（5桁の文字列）。調査単位区間番号の番号を振る単位（都道府県、指定市など）のコード。元データで先頭の0が落ちているので補った。
  en: 'Area code of the travel speed survey (5-character string): code of the area (prefecture, designated city, etc.) within which the survey unit sections are numbered. Leading zeros restored.'
- name: speed_unit_section_number
  src: 旅行速度／調査単位区間番号
  pad: 5
  ja: 旅行速度調査単位区間番号（5桁の文字列）。交通調査基本区間を集約した調査単位区間の番号。都道府県指定市コードと組み合わせて1つの調査単位区間を表す。元データで先頭の0が落ちているので補った。
  en: 'Travel speed survey unit section number (5-character string): number of the survey unit section that groups basic sections. Identifies a unit section together with the area code. Leading zeros restored.'
- name: peak_up_speed_measured
  src: 朝夕（混雑時）／上り／旅行速度計測・非計測の別
  codes: &id004
    '1': 計測
    '2': 非計測（共通）
    '3': 非計測（H27調査値）
  ja: '朝夕（混雑時）・上りの旅行速度を計測したか。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 計測、2 非計測（共通）、3 非計測（H27調査値）（数字は元のコード）。非計測（共通）は反対方向・他の時間帯・前後の区間の値で補ったもの、非計測（H27調査値）は平成27年度の値で補ったもの。'
  en: 'Whether the travel speed for peak hours (7:00-9:00 and 17:00-19:00), up direction was measured. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 計測 measured, 非計測（共通） filled from the opposite direction, another time band or an adjacent section, 非計測（H27調査値） filled with the 2015 value.'
- name: peak_up_speed_small
  src: 朝夕（混雑時）／上り／旅行速度／小型車（ｋｍ／ｈ）
  type: DOUBLE
  ja: 朝夕（混雑時）・上りの旅行速度（小型車、km/h）。信号や渋滞での停止時間を含む。車種別は ETC2.0 プローブ情報で調べた区間だけにある。
  en: Travel speed for peak hours (7:00-9:00 and 17:00-19:00), up direction, small vehicles (km/h), including stops at signals and in congestion. By vehicle type only for sections surveyed with ETC2.0 probe data.
- name: peak_up_speed_large
  src: 朝夕（混雑時）／上り／旅行速度／大型車（ｋｍ／ｈ）
  type: DOUBLE
  ja: 朝夕（混雑時）・上りの旅行速度（大型車、km/h）。信号や渋滞での停止時間を含む。車種別は ETC2.0 プローブ情報で調べた区間だけにある。
  en: Travel speed for peak hours (7:00-9:00 and 17:00-19:00), up direction, large vehicles (km/h), including stops at signals and in congestion. By vehicle type only for sections surveyed with ETC2.0 probe data.
- name: peak_up_speed
