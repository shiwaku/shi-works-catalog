  ja: '朝夕（混雑時）・下りの旅行速度を計測したか。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 計測、2 非計測（共通）、3 非計測（H27調査値）（数字は元のコード）。非計測（共通）は反対方向・他の時間帯・前後の区間の値で補ったもの、非計測（H27調査値）は平成27年度の値で補ったもの。'
