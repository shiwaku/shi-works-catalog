# 道路交通センサス（令和3年度 一般交通量調査 箇所別基本表）の列の定義
#
# この1ファイルから、変換の SQL（build.py）、collection.json の table:columns、
# README の列の表を作る（docs/metadata.md 第5章「同じ元から作る」）。
#
#   name  : 列名（英語の snake_case。日英で同じ）
#   src   : 元の列名（箇所別基本表 CSV の見出し。全角のまま）。足した列は null
#   type  : 型（SMALLINT、INTEGER、DOUBLE）。省略すると文字列
#   pad   : 先頭を 0 で埋める桁数（元データで先頭の 0 が落ちているコード）
#   codes : コード → ラベル。表にないコードがあれば build.py が止まる
#   bool  : コード → true / false
#   sql   : 値の式（足した列）
#   ja    : 説明（日本語）。「元の列名: …」は自動で先頭に付く
#   en    : 説明（英語）
#
# コードとラベルは、国土交通省「箇所別基本表及び時間帯別交通量表に関する説明資料」
# （https://www.mlit.go.jp/road/census/r3/data/pdf/kasyorep.pdf）第5章による。

columns:
- name: section_id
  src: 交通調査基本区間番号
  ja: 交通調査基本区間番号（11桁の文字列）。都道府県（2桁）＋道路種別（1桁）＋路線番号（4桁）＋順番号（4桁）で、路線の起点から終点に向けて昇順。1行1区間で、重複はない。
  en: 'Traffic survey basic section number (11-character string): prefecture (2) + road type (1) + route number (4) + sequence (4), ascending from the start to the end of the route. One row per section; unique.'
- name: pref_code
  src: null
  sql: substr("交通調査基本区間番号", 1, 2)
  ja: 都道府県コード（2桁の文字列）。section_id の先頭2桁。
  en: Prefecture code (2-character string), the first two characters of section_id.
- name: generation_split
  src: 世代管理番号（十の位）
  type: SMALLINT
  ja: 世代管理番号の十の位（区間を分割した回数）。平成22年度調査以降に区間を分割したとき1つ増える。
  en: 'Tens digit of the generation number: how many times the section has been split since the 2010 survey.'
- name: generation_change
  src: 世代管理番号（一の位）
  type: SMALLINT
  ja: 世代管理番号の一の位（属性を変えた回数）。
  en: 'Units digit of the generation number: how many times the attributes of the section have changed.'
- name: road_type
  src: 道路種別
  codes:
    '1': 高速自動車国道
    '2': 都市高速道路
    '3': 一般国道
    '4': 主要地方道（都道府県道）
    '5': 主要地方道（指定市市道）
    '6': 一般都道府県道
    '7': 指定市の一般市道
  ja: '道路種別。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 高速自動車国道、2 都市高速道路、3 一般国道、4 主要地方道（都道府県道）、5 主要地方道（指定市市道）、6 一般都道府県道、7 指定市の一般市道（数字は元のコード）。'
  en: 'Road type. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 1 national expressway (高速自動車国道), 2 urban expressway, 3 national highway (一般国道), 4 major local road (prefectural), 5 major local road (designated city), 6 general prefectural road, 7 general city road of a designated city.'
- name: route_number
  src: 路線番号
  type: SMALLINT
  ja: 路線番号。一般国道は国道番号、都道府県道は標識などの番号。高速自動車国道は説明資料のコード表の番号。
  en: Route number. The national highway number for national highways, the signed number for prefectural roads, and the number in the MLIT code table for expressways.
- name: route_name
  src: 路線名
  ja: 路線名（政令・告示などによる正式な名前）。
  en: Official route name (in Japanese).
- name: start_connection_type
  src: 起点側／接続区分
  codes: &id001
    '1': 他の枝路線の終点側と接続
    '2': 他の枝路線の起点側と接続
    '3': 都道府県境
    '4': 異なる2つの枝路線の端点同士だけが接続
    '5': 道路管理者が異なる箇所又は自動車専用道路の起点終点
    '6': 市区町村境
    '7': 大規模施設等へのアクセス点
    '8': 枝路線の端点（他の基本区間と接続しない）
    '9': 旧分割点
  ja: '起点側の端点の接続の形。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 他の枝路線の終点側と接続、2 他の枝路線の起点側と接続、3 都道府県境、4 異なる2つの枝路線の端点同士だけが接続、5 道路管理者が異なる箇所又は自動車専用道路の起点終点、6 市区町村境、7 大規模施設等へのアクセス点、8 枝路線の端点（他の基本区間と接続しない）、9 旧分割点（数字は元のコード）。'
  en: 'How the start point of the section connects. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): e.g. connection to another branch route, prefectural or municipal boundary, access point to a large facility, end of the branch route.'
- name: start_connected_section_id
  src: 起点側／交通調査基本区間番号
  ja: 起点側の端点でつながる区間の交通調査基本区間番号（接続区分が他の枝路線との接続・都道府県境のとき）。
  en: Section number of the section connected at the start point (for connections to another branch route or at a prefectural boundary).
- name: start_connected_generation_split
  src: 起点側／世代管理番号（十の位）
  type: SMALLINT
  ja: 起点側でつながる区間の世代管理番号の十の位。
  en: Tens digit of the generation number of the section connected at the start point.
- name: start_connected_route_name
  src: 起点側／路線名等
  ja: 起点側でつながる路線の名前。市区町村境のときは「○○市・△△町 境」のような境界の名前。
  en: Name of the route connected at the start point, or the boundary name (e.g. "○○市・△△町 境") at a municipal boundary (in Japanese).
- name: start_remarks
  src: 起点側／備考
  ja: 起点側の備考。自動車専用道路の IC・JCT 名や、大規模施設の種類など。
  en: Remarks on the start point, such as interchange or junction names on motorways, or the kind of large facility (in Japanese).
- name: end_connection_type
  src: 終点側／接続区分
  codes: *id001
  ja: '終点側の端点の接続の形。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 他の枝路線の終点側と接続、2 他の枝路線の起点側と接続、3 都道府県境、4 異なる2つの枝路線の端点同士だけが接続、5 道路管理者が異なる箇所又は自動車専用道路の起点終点、6 市区町村境、7 大規模施設等へのアクセス点、8 枝路線の端点（他の基本区間と接続しない）、9 旧分割点（数字は元のコード）。'
  en: 'How the end point of the section connects. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): e.g. connection to another branch route, prefectural or municipal boundary, access point to a large facility, end of the branch route.'
- name: end_connected_section_id
  src: 終点側／交通調査基本区間番号
  ja: 終点側の端点でつながる区間の交通調査基本区間番号（接続区分が他の枝路線との接続・都道府県境のとき）。
  en: Section number of the section connected at the end point (for connections to another branch route or at a prefectural boundary).
- name: end_connected_generation_split
  src: 終点側／世代管理番号（十の位）
  type: SMALLINT
  ja: 終点側でつながる区間の世代管理番号の十の位。
  en: Tens digit of the generation number of the section connected at the end point.
- name: end_connected_route_name
  src: 終点側／路線名等
  ja: 終点側でつながる路線の名前。市区町村境のときは「○○市・△△町 境」のような境界の名前。
  en: Name of the route connected at the end point, or the boundary name (e.g. "○○市・△△町 境") at a municipal boundary (in Japanese).
- name: end_remarks
  src: 終点側／備考
  ja: 終点側の備考。自動車専用道路の IC・JCT 名や、大規模施設の種類など。
  en: Remarks on the end point, such as interchange or junction names on motorways, or the kind of large facility (in Japanese).
- name: old_new_road_type
  src: 現道旧道区分
  codes:
    '1': 現道
    '2': 旧道
    '3': 新道
    '4': 旧道集約
  ja: '現道か旧道か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 現道、2 旧道、3 新道、4 旧道集約（数字は元のコード）。'
  en: 'Whether the road is the current road, an old road or a new road. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 現道 current, 旧道 old, 新道 new, 旧道集約 aggregated old road.'
- name: administrator
  src: 管理区分
  codes:
    '1': 国土交通大臣
    '2': 都道府県知事又は都道府県
    '3': 指定市の長又は指定市
    '4': 東日本・中日本・西日本高速道路株式会社
    '5': 首都高速道路株式会社
    '6': 阪神高速道路株式会社
    '7': 本州四国連絡高速道路株式会社
    '8': 地方道路公社等
    '9': その他
  ja: '道路管理者。権限代行区間は実際の管理者。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 国土交通大臣、2 都道府県知事又は都道府県、3 指定市の長又は指定市、4 東日本・中日本・西日本高速道路株式会社、5 首都高速道路株式会社、6 阪神高速道路株式会社、7 本州四国連絡高速道路株式会社、8 地方道路公社等、9 その他（数字は元のコード）。'
  en: 'Road administrator (the actual administrator for sections under delegated authority). Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): e.g. 国土交通大臣 Minister of MLIT, 都道府県知事又は都道府県 prefecture, 指定市の長又は指定市 designated city, expressway companies.'
- name: admin_code
  src: 市区町村コード
  pad: 5
  ja: 市区町村コード（5桁の文字列。チェックディジットなし）。令和3年4月1日時点の標準地域コードで、政令指定都市は区ごと。元データで先頭の0が落ちているので補った。
  en: Municipality code (5-character string, without the check digit), standard area code as of 1 April 2021, with designated cities split into wards. The leading zero dropped in the source has been restored.
- name: is_motorway
  src: 自動車専用道路の別
  bool:
    '1': true
    '0': false
  ja: 自動車専用道路（高速自動車国道または道路法第48条の2）の区間なら true。元のコードは 1（自動車専用道路）と 0（それ以外）。
  en: True for motorway sections (national expressways or roads under Article 48-2 of the Road Act). Source codes 1 (motorway) and 0 (other).
- name: section_type
  src: 区間種別
  codes:
    '0': 通常区間
    '1': 上下線分離区間
    '2': 複断面区間
    '3': 上下線分離かつ複断面区間
    '6': 交通不能区間
    '7': 循環区間
    '8': 部分供用区間
  ja: '区間の種類。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 通常区間、1 上下線分離区間、2 複断面区間、3 上下線分離かつ複断面区間、6 交通不能区間、7 循環区間、8 部分供用区間（数字は元のコード）。'
  en: 'Section type. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 通常区間 normal, 上下線分離区間 directionally separated, 複断面区間 multi-deck/parallel, 交通不能区間 impassable to motor vehicles, 循環区間 loop, 部分供用区間 partially open.'
- name: separation_type
  src: 分離区間／分離区分
  codes:
    '0': 分離なし
    '1': 上り線（上り主断面）
    '2': 下り線（主断面、下り主断面）
    '3': 上り複断面
    '4': 複断面（下り複断面）
  ja: '上下線分離・複断面の区間で、どちらの線か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 分離なし、1 上り線（上り主断面）、2 下り線（主断面、下り主断面）、3 上り複断面、4 複断面（下り複断面）（数字は元のコード）。'
  en: 'For separated or multi-deck sections, which direction or deck this row is. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 分離なし none, 上り線 up line, 下り線 down line or main deck, 上り複断面 up secondary deck, 複断面 secondary deck.'
- name: separation_main_section_id
  src: 分離区間／交通調査基本区間番号
  ja: 分離区分が上り線・上り複断面・複断面のとき、対応する主路線の交通調査基本区間番号。
  en: Section number of the corresponding main line, for up lines and secondary decks.
- name: length_km
  src: 区間延長（ｋｍ）
  type: DOUBLE
  ja: 区間延長（km。道路中心線の上の長さ。小数1桁）。
  en: Section length along the road centre line (km, one decimal place).
- name: high_standard_road
  src: 高規格道路の別
  codes:
    '0': 高規格道路以外の道路
    '1': 高規格幹線道路
    '2': 地域高規格道路
  ja: '高規格道路かどうか。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 高規格道路以外の道路、1 高規格幹線道路、2 地域高規格道路（数字は元のコード）。'
  en: 'Whether the road is a high-standard road. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 高規格幹線道路 high-standard arterial highway, 地域高規格道路 regional high-standard highway, 高規格道路以外の道路 other.'
- name: national_road_designated_section
  src: 一般国道指定区間
  codes:
    '0': 一般国道以外の道路
    '1': 一般国道（指定区間）
    '2': 一般国道（指定区間外）
  ja: '一般国道の指定区間（国が管理する区間）かどうか。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 一般国道以外の道路、1 一般国道（指定区間）、2 一般国道（指定区間外）（数字は元のコード）。'
  en: 'Whether the national highway section is a designated section (managed by the national government). Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 一般国道（指定区間） designated, 一般国道（指定区間外） not designated, 一般国道以外の道路 not a national highway.'
- name: one_way
  src: 一方通行フラグ
  codes:
    '0': なし
    '1': 一方通行（起点から終点方向に通行可能）
    '2': 一方通行（終点から起点方向に通行可能）
  ja: '恒常的な一方通行の規制。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 なし、1 一方通行（起点から終点方向に通行可能）、2 一方通行（終点から起点方向に通行可能）（数字は元のコード）。'
  en: 'Permanent one-way restriction. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): なし none, 起点から終点方向 start to end, 終点から起点方向 end to start.'
- name: h27_section_id
  src: 平成２７年度／交通調査基本区間番号
  ja: この区間に対応する平成27年度（2015年）調査の交通調査基本区間番号。2015年のデータと結び付けるときに使う。
  en: Section number in the 2015 survey corresponding to this section. Use it to join the 2015 data.
- name: h27_generation_split
  src: 平成２７年度／世代管理番号（十の位）
  type: SMALLINT
  ja: 平成27年度の区間の世代管理番号の十の位。
  en: Tens digit of the generation number of the 2015 section.
- name: h27_generation_change
  src: 平成２７年度／世代管理番号（一の位）
  type: SMALLINT
  ja: 平成27年度の区間の世代管理番号の一の位。
  en: Units digit of the generation number of the 2015 section.
- name: traffic_unit_area_code
  src: 交通量／都道府県指定市コード
  pad: 5
  ja: 交通量調査の都道府県指定市コード（5桁の文字列）。調査単位区間番号の番号を振る単位（都道府県、指定市など）のコード。元データで先頭の0が落ちているので補った。
  en: 'Area code of the traffic volume survey (5-character string): code of the area (prefecture, designated city, etc.) within which the survey unit sections are numbered. Leading zeros restored.'
- name: traffic_unit_section_number
  src: 交通量／調査単位区間番号
  pad: 5
  ja: 交通量調査単位区間番号（5桁の文字列）。交通調査基本区間を集約した調査単位区間の番号。都道府県指定市コードと組み合わせて1つの調査単位区間を表す。元データで先頭の0が落ちているので補った。
  en: 'Traffic volume survey unit section number (5-character string): number of the survey unit section that groups basic sections. Identifies a unit section together with the area code. Leading zeros restored. Traffic volumes are the same for all basic sections in a unit section.'
- name: up_observation_section_id
  src: 上り／観測地点交通調査基本区間番号
  ja: 上りの交通量を観測した地点がある交通調査基本区間の番号（観測した区間のみ）。
  en: Section number of the basic section containing the observation point for the up direction (observed sections only).
- name: up_observation_place
  src: 上り／交通量観測地点地名
  ja: 上りの交通量観測地点の地名、または IC 区間名（観測した区間のみ）。
  en: Place name of the observation point for the up direction, or the interchange section name (observed sections only; in Japanese).
- name: up_traffic_observed
  src: 上り／令和３年度調査交通量観測・非観測の別
  codes: &id002
    '1': 観測
    '2': 非観測（推定値）
  ja: '上りの交通量が令和3年度の観測値か推定値か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 1 観測、2 非観測（推定値）（数字は元のコード）。空は推定できなかった区間（データなし）。推定値は実態と離れていることがあると説明資料にある。'
  en: 'Whether the up direction traffic volume was observed in 2021 or estimated. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 観測 observed, 非観測（推定値） estimated. Null where it could not be estimated. The MLIT document notes that estimates may differ from actual traffic.'
- name: up_individual_survey_used
  src: 上り／個別調査結果活用の別
  bool:
    '1': true
    '0': false
  ja: 上りの交通量に、平成27年度以降の個別調査の観測値を使ったなら true。元のコードは 1（活用あり）と 0（活用なし）。
  en: True if the up direction traffic volume uses values from an individual survey after 2015. Source codes 1 (used) and 0 (not used).
- name: up_observation_hours
  src: 上り／１２時間・２４時間観測の別
  codes: &id003
    '0': 調査対象区間外（非観測）
    '1': 12時間観測地点
    '2': 24時間観測地点
  ja: '上りの観測が12時間か24時間か。値は、元のコードを国土交通省の説明資料の区分名に直したもの: 0 調査対象区間外（非観測）、1 12時間観測地点、2 24時間観測地点（数字は元のコード）。'
  en: 'Whether the up direction observation was 12-hour or 24-hour. Values are the category names (in Japanese) of the MLIT explanation document, converted from the source codes (listed with their codes in the Japanese description): 12時間観測地点 12-hour, 24時間観測地点 24-hour, 調査対象区間外（非観測） not observed.'
- name: up_observation_date
  src: 上り／交通量観測年月日
  ja: 上りの交通量の観測年月日（YYYYMMDD の8桁の文字列）。常時観測装置などで複数日のデータを使ったときは日が「00」。
  en: Observation date for the up direction (8-character string YYYYMMDD). The day is "00" when data from several days (e.g. permanent counters) were used.
- name: up_traffic_12h_small
  src: 上り／昼間１２時間自動車類交通量／小型車（台）
  type: INTEGER
  ja: 上りの昼間12時間自動車類交通量（小型車、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic in the up direction, small vehicles (vehicles).
- name: up_traffic_12h_large
  src: 上り／昼間１２時間自動車類交通量／大型車（台）
  type: INTEGER
  ja: 上りの昼間12時間自動車類交通量（大型車、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic in the up direction, large vehicles (vehicles).
- name: up_traffic_12h
  src: 上り／昼間１２時間自動車類交通量／合計（台）
  type: INTEGER
  ja: 上りの昼間12時間自動車類交通量（合計、台）。
  en: Daytime 12-hour (7:00-19:00) motor vehicle traffic in the up direction, all vehicles (vehicles).
- name: up_traffic_24h_small
