  type: INTEGER
  ja: 朝夕（混雑時）・上りの旅行速度の算出に使った ETC2.0 プローブ情報の件数（小型車）。
  en: Number of ETC2.0 probe records used for the travel speed for peak hours (7:00-9:00 and 17:00-19:00), up direction, small vehicles.
