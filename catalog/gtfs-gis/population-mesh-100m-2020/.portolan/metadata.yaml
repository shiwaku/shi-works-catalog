title: "令和2年 簡易100mメッシュ人口"
description: "令和2年国勢調査の250mメッシュの人口を、建物の面積で100mメッシュに按分した推計人口（西澤明、GTFS-GIS.jp）。全国4,979,919メッシュの総人口と年齢区分別の人口を、1メッシュ1行のポリゴンで持つ。"

